name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch latest contributions
        env:
          GH_PROFILE_USER: mridul2507
        run: |
          python scripts/fetch_contributions.py

      - name: Verify fetched data
        run: |
          python - << 'EOF'
          import json
          with open("data/contributions.json") as f:
              d = json.load(f)
          print("Username:", d.get("username"))
          print("Total:", d.get("total_contributions"))
          print("Current streak:", d.get("current_streak"))
          EOF

      - name: Generate SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph [skip ci]"
          file_pattern: |
            data/contributions.json
            contrib-heatmap.svg